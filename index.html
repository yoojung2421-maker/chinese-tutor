<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부수(Radical) 학습 툴</title>
  <!-- Google Fonts: Noto Sans KR (Korean), Noto Sans SC (Simplified Chinese) for beautiful typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f7f9fa;
      --primary-color: #4a90e2; /* Blue color highlighting the radical */
      --secondary-color: #e8f2ff;
      --text-color: #2c3e50;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 0 1px 8px rgba(0, 0, 0, 0.02);
      --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', 'Noto Sans SC', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a252f;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1rem;
      color: #7f8c8d;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* Radical Header Card */
    .radical-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.03);
      transition: var(--transition);
    }

    .radical-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, var(--primary-color), #3498db);
    }

    .radical-badge {
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary-color);
      background-color: var(--secondary-color);
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .radical-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .radical-character {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 4.5rem;
      font-weight: 700;
      color: var(--primary-color);
      line-height: 1;
      text-shadow: 0 4px 10px rgba(74, 144, 226, 0.15);
    }

    .radical-meaning {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-color);
    }

    .radical-desc {
      color: #7f8c8d;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* Word Grid Layout */
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    /* Card Flip Structure */
    .flip-card {
      background-color: transparent;
      height: 200px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    /* JavaScript will apply this class on click or hover */
    .flip-card.flipped .flip-card-inner,
    .flip-card:hover .flip-card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .card-front {
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    .card-back {
      background: linear-gradient(135deg, #2c3e50, #1a252f);
      color: white;
      transform: rotateY(180deg);
      padding: 20px;
    }

    /* Character styling inside front card */
    .hanzi-display {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 5px;
    }

    /* Highlight class for radicals */
    .radical-highlight {
      color: var(--primary-color);
      position: relative;
    }

    .remain-stroke {
      color: #34495e;
    }

    .card-level-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: #7f8c8d;
      background-color: #f0f3f4;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 5px;
    }

    /* Back Card Content styling */
    .pinyin-display {
      font-size: 1.4rem;
      font-weight: 500;
      color: #5dade2;
      margin-bottom: 8px;
    }

    .meaning-display {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .details-display {
      font-size: 0.9rem;
      color: #bdc3c7;
      margin-bottom: 8px;
    }

    /* TTS Audio Button */
    .audio-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .audio-btn:hover {
      background: var(--primary-color);
      transform: scale(1.1);
    }

    .audio-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Control Button */
    .controls {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary-color) 0%, #3498db 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-icon {
      font-size: 1.2rem;
    }

    /* Fade transition animation */
    .fade-out {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .fade-in {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* Mobile responsiveness */
    @media (max-width: 600px) {
      body {
        padding: 15px;
      }
      
      header h1 {
        font-size: 1.6rem;
      }

      .radical-character {
        font-size: 3.5rem;
      }

      .radical-meaning {
        font-size: 1.4rem;
      }

      .word-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .flip-card {
        height: 160px;
      }

      .hanzi-display {
        font-size: 3rem;
      }

      .pinyin-display {
        font-size: 1.1rem;
      }

      .meaning-display {
        font-size: 1rem;
      }
      
      .details-display {
        font-size: 0.8rem;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>부수 연상 암기</h1>
    <p>부수를 이해하면 한자가 쉬워집니다. 카드를 클릭하거나 마우스 오버해 보세요!</p>
  </header>

  <div class="container">
    <!-- Radical Display Section -->
    <div class="radical-card" id="radicalCard">
      <div class="radical-badge">오늘의 핵심 부수</div>

    </div>

    <!-- HSK Words Grid -->
    <div class="word-grid" id="wordGrid">
      <!-- Generated dynamically by Javascript -->
    </div>

    <!-- Toggle Buttons -->
    <div class="controls">
      <button class="btn" id="nextBtn">
        <span>다음 부수 보기</span>
        <span class="btn-icon">→</span>
      </button>
    </div>
  </div>

    // Renders the words for the current radical index
    function renderContent(index) {
      const data = learningData[index];
      
      // Update Radical Card Info
      radicalChar.textContent = data.radical;
      radicalMeaning.textContent = data.meaning;
      radicalDesc.textContent = data.desc;

      // Clear previous grid items
      wordGrid.innerHTML = "";

      // Build cards
      data.words.forEach((word) => {
        const card = document.createElement("div");
        card.className = "flip-card";

        // HTML elements to split Chinese character into parts
        const hanziChar = word.hanzi;
        let hanziHTML = "";
        
        for (let i = 0; i < hanziChar.length; i++) {
          if (i === word.radicalIdx) {
            hanziHTML += `<span class="radical-highlight">${hanziChar[i]}</span>`;
          } else {
            hanziHTML += `<span class="remain-stroke">${hanziChar[i]}</span>`;
          }
        }

        card.innerHTML = `
          <div class="flip-card-inner">
            <div class="card-front">
              <div class="hanzi-display">${hanziHTML}</div>
              <div class="card-level-badge">hsk3</div>
            </div>
            <div class="card-back">
              <div class="pinyin-display">${word.pinyin}</div>
              <div class="meaning-display">${word.korean}</div>
              <div class="details-display">${word.explain}</div>
              <button class="audio-btn" title="발음 듣기">
                <svg viewBox="0 0 24 24">
                  <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
              </button>
            </div>
          </div>
        `;

        // Touch support and click action
        card.addEventListener("click", function(e) {
          // Check if we are flipping it open (i.e. currently it does not have 'flipped' class, or we check toggle status)
          const isFlippingOpen = !this.classList.contains("flipped");
          this.classList.toggle("flipped");
          
          // Play pronunciation when flipping the card open
          if (isFlippingOpen) {
            speakHanzi(word.hanzi);
          }
        });

        // Add speak handler (standalone button still works)
        const audioBtn = card.querySelector(".audio-btn");
        audioBtn.addEventListener("click", function(e) {
          e.stopPropagation(); // prevent flipping when clicking the speaker
          speakHanzi(word.hanzi);
        });

        wordGrid.appendChild(card);
      });
    }

    // TTS speaker helper (robust version)
    function speakHanzi(text) {
      if ('speechSynthesis' in window) {
        // Force resume in case browser speechSynthesis is in a stuck/paused state
        window.speechSynthesis.resume();
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN'; 
        utterance.rate = 0.8;    
        utterance.volume = 1.0;  // Force full volume for the utterance
        
        // Find and assign explicit Chinese voice if loaded to prevent browser default fallback issues
        const voices = window.speechSynthesis.getVoices();
        const zhVoice = voices.find(voice => voice.lang.includes('zh') || voice.lang.includes('ZH'));
        if (zhVoice) {
          utterance.voice = zhVoice;
        }
        
        window.speechSynthesis.speak(utterance);
      } else {
        alert("이 브라우저는 음성 합성(TTS)을 지원하지 않습니다.");
      }
    }

    // Pre-load voices on browser load to prevent cold-start delays
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
      }
    }

    // Smooth transition animation when switching radicals
    function handleTransition() {
      // Fade out
      radicalCard.classList.add("fade-out");
      wordGrid.classList.add("fade-out");

      setTimeout(() => {
        // Toggle index
        currentIndex = (currentIndex + 1) % learningData.length;
        renderContent(currentIndex);

        // Fade in
        radicalCard.classList.remove("fade-out");
        wordGrid.classList.remove("fade-out");
        
        radicalCard.classList.add("fade-in");
        wordGrid.classList.add("fade-in");

        setTimeout(() => {
          radicalCard.classList.remove("fade-in");
          wordGrid.classList.remove("fade-in");
        }, 300);
      }, 300);
    }

    // Event listener for Next Button
    nextBtn.addEventListener("click", handleTransition);

    // Initial render
    renderContent(currentIndex);
